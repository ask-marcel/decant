# .github/workflows/ci.yml - the authoritative gate set (rules 4.6, 15.1)
#
# CI runs every gate, fast and slow, on a frozen lockfile, so a bypassed local
# hook is still caught. This is the line that cannot be skipped with
# --no-verify: make it a required status check in branch protection (rule 13.2,
# governance.md), and nothing merges while it is red. The pre-commit hook
# (assets/pre-commit) is the fast first line; this is the real one.
#
# Actions are pinned to major tags for readability; pin to a commit SHA for
# supply-chain safety in a real repo (rule 5.4).
name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for gitleaks detect and mutate:changed
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile # lockfile drift fails here (rule 5.3)
      - name: package.json (no latest / * / bare dist-tag)
        run: bash scripts/check-package-json.sh
      # The binary rather than `gitleaks/gitleaks-action`, which asks an organisation repo for a
      # paid licence key and fails without one. Pinned so a new release cannot change what the gate
      # means without somebody choosing it.
      - name: install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: secret scan (full history)
        run: gitleaks detect --redact --no-banner
      - name: lint (strict, type-aware, zero errors AND zero warnings)
        run: bun run lint:strict
      - name: typecheck
        run: bun run typecheck
      - name: tests
        run: bun test
      - name: coverage-preload sync (an out-of-sync preload lies about coverage)
        run: bun run scripts/regenerate-coverage-preload.ts --check
      - name: coverage (per-tier thresholds)
        run: bun run coverage
      - name: mutation (changed files on a PR, full sweep on main)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bun run mutate:changed
          else
            # Without the html reporter: serialising 4,413 mutants into one document is a lot of
            # string for a report nobody reads on CI. Incremental mode is off in the config itself,
            # which is where the crash lived; see the comment there.
            bunx stryker run --reporters clear-text,progress
          fi
      # The two ignores are `xlsx`, reached through `ask-marcel-office-cli`. SheetJS left npm: 0.18.5
      # is the newest published there and the advisories want 0.19.3 and 0.20.2, which exist only on
      # the SheetJS CDN. No upgrade can satisfy this from here, so the gate would fail for ever on
      # something no change to this repo can fix. The real fix is in `ask-marcel-office-cli`,
      # pointing xlsx at the CDN tarball; take these back out when it lands.
      - name: dependency CVEs (fails on high)
        run: bun audit --audit-level=high --ignore GHSA-4r6h-8v6p-xvw6 --ignore GHSA-5pgg-2g8v-p4x9
